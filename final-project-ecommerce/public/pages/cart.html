<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - ShopHub</title>

    <!-- Set theme before CSS loads to prevent white flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <!-- Page Loading Overlay -->
    <div id="page-transition" class="page-transition hidden">
        <div class="page-transition-content">
            <div class="page-transition-text">Loading...</div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">ShopHub</a>
            <button class="hamburger"><span></span><span></span><span></span></button>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/catalog">Catalog</a></li>
                <li><a href="/cart" class="cart-badge">Cart <span class="badge">0</span></a></li>
                <li><a href="/profile">Profile</a></li>
                <li><a href="/seller" style="display: none;">Seller</a></li>
                <li><a href="/login">Login</a></li>
                <li><a href="/register">Register</a></li>
                <li><button class="theme-toggle">🌙</button></li>
                <li><button id="logout-btn" class="btn btn-outline" style="display: none;"
                        onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding: 2rem 0;">
        <h1 class="mb-4">Shopping Cart</h1>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            <div id="cart-items"></div>
            <div>
                <div class="card" style="position: sticky; top: 100px;">
                    <h2 class="mb-3">Order Summary</h2>
                    <div
                        style="display: flex; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">
                        <span>Subtotal:</span>
                        <span id="subtotal" style="font-weight: 600;">$0.00</span>
                    </div>
                    <div
                        style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: bold;">
                        <span>Total:</span>
                        <span id="total" style="color: var(--primary-color);">$0.00</span>
                    </div>
                    <a href="/checkout" class="btn btn-primary" style="width: 100%; display: block; text-align: center;"
                        id="checkout-btn">
                        Proceed to Checkout
                    </a>
                    <a href="/catalog" class="btn btn-outline"
                        style="width: 100%; display: block; text-align: center; margin-top: 1rem;">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        async function renderCart() {
            try {
                const cart = await getCart();
                const container = document.getElementById('cart-items');
                const checkoutBtn = document.getElementById('checkout-btn');

                if (cart.length === 0) {
                    container.innerHTML = '<div class="card"><p>Your cart is empty. <a href="/catalog" style="color: var(--primary-color);">Continue shopping</a></p></div>';
                    checkoutBtn.style.display = 'none';
                } else {
                    container.innerHTML = cart.map(item => `
              <div class="card mb-2">
                <div style="display: flex; gap: 1rem; align-items: center;">
                  <img src="${item.image}" alt="${item.name}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 0.5rem;">
                  <div style="flex: 1;">
                    <h3 style="margin-bottom: 0.5rem;">${item.name}</h3>
                    <p style="color: var(--primary-color); font-weight: 600; margin-bottom: 0.5rem;">${formatCurrency(item.price)}</p>
                     <div style="display: flex; align-items: center; gap: 1rem;">
                       <div class="quantity-controls" style="display: flex; align-items: center; border: 2px solid var(--border-color); border-radius: 0.5rem;">
                         <button onclick="decrementQuantity('${item.productId}')" 
                           style="border: none; background: none; padding: 0.5rem; cursor: pointer; font-size: 1.2rem;">−</button>
                         <input type="number" id="qty-${item.productId}" value="${item.quantity}" min="1" max="99"
                           onchange="updateCartItemQuantity('${item.productId}', this.value)"
                           style="width: 50px; border: none; text-align: center; padding: 0.5rem;">
                         <button onclick="incrementQuantity('${item.productId}')"
                           style="border: none; background: none; padding: 0.5rem; cursor: pointer; font-size: 1.2rem;">+</button>
                       </div>
                       <span style="color: var(--text-secondary);">× ${formatCurrency(item.price)} = ${formatCurrency(item.price * item.quantity)}</span>
                     </div>
                  </div>
                  <button onclick="removeFromCart('${item.productId}')" class="btn btn-danger">Remove</button>
                </div>
              </div>
            `).join('');
                    checkoutBtn.style.display = 'block';
                }

                await updateTotals();
            } catch (error) {
                console.error('Error rendering cart:', error);
                const container = document.getElementById('cart-items');
                const checkoutBtn = document.getElementById('checkout-btn');
                container.innerHTML = '<div class="card"><p>Error loading cart. Please refresh the page.</p></div>';
                checkoutBtn.style.display = 'none';
            }
        }

        async function updateTotals() {
            try {
                const total = await getCartTotal();
                document.getElementById('subtotal').textContent = formatCurrency(total);
                document.getElementById('total').textContent = formatCurrency(total);
            } catch (error) {
                console.error('Error updating totals:', error);
                document.getElementById('subtotal').textContent = formatCurrency(0);
                document.getElementById('total').textContent = formatCurrency(0);
            }
        }

        window.updateCartItemQuantity = async (productId, quantity) => {
            try {
                // Validate input
                const qty = parseInt(quantity);
                if (isNaN(qty) || qty < 1) {
                    showNotification('Quantity must be at least 1', 'error');
                    await renderCart(); // Reset to original value
                    return;
                }
                if (qty > 99) {
                    showNotification('Maximum quantity is 99', 'error');
                    await renderCart(); // Reset to original value
                    return;
                }
                
                // Call the API function from common.js
                await updateCartItemQuantityAPI(productId, qty);
                await renderCart();
            } catch (error) {
                console.error('Error updating cart item quantity:', error);
                showNotification('Error updating cart', 'error');
                await renderCart(); // Reset to original value on error
            }
        };

        window.removeFromCart = async (productId) => {
            try {
                if (confirm('Are you sure you want to remove this item from your cart?')) {
                    await removeFromCartAPI(productId);
                    await renderCart();
                    showNotification('Item removed from cart', 'success');
                }
            } catch (error) {
                console.error('Error removing from cart:', error);
                showNotification('Error removing item from cart', 'error');
            }
        };

        window.incrementQuantity = async (productId) => {
            const input = document.getElementById(`qty-${productId}`);
            const currentQty = parseInt(input.value);
            if (currentQty < 99) {
                input.value = currentQty + 1;
                await updateCartItemQuantity(productId, currentQty + 1);
            }
        };

        window.decrementQuantity = async (productId) => {
            const input = document.getElementById(`qty-${productId}`);
            const currentQty = parseInt(input.value);
            if (currentQty > 1) {
                input.value = currentQty - 1;
                await updateCartItemQuantity(productId, currentQty - 1);
            }
        };

        // Initial render
        renderCart();
    </script>

    <style>
        @media (max-width: 768px) {
            .container>div {
                grid-template-columns: 1fr !important;
            }
        }
        
        /* Quantity controls styling */
        .quantity-controls button:hover {
            background-color: var(--primary-color);
            color: white;
        }
        
        .quantity-controls input:focus {
            outline: none;
        }
        
        .quantity-controls button:active {
            transform: scale(0.95);
        }
    </style>
</body>

</html>
