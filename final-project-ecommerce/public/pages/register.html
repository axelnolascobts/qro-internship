<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShopHub</title>
    <link rel="stylesheet" href="/css/main.css">

    <!-- Set theme before CSS loads to prevent white flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>

<body>
    <div class="container"
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 0;">
        <div class="card" style="max-width: 500px; width: 100%;">
            <h1 class="text-center mb-3">Register</h1>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="name">First Name *</label>
                    <input type="text" id="name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="lastname">Last Name *</label>
                    <input type="text" id="lastname" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email *</label>
                    <input type="email" id="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="birthdate">Birthdate</label>
                    <input type="date" id="birthdate" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label" for="address">Address</label>
                    <input type="text" id="address" class="form-input" placeholder="123 Main St, City, State">
                </div>

                <div class="form-group">
                    <label class="form-label">Account Type *</label>
                    <div class="radio-group" style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem;">
                        <label class="radio-option" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="radio" name="role" value="customer" checked style="margin: 0;">
                            <span>Customer - Buy products</span>
                        </label>
                        <label class="radio-option" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="radio" name="role" value="seller" style="margin: 0;">
                            <span>Seller - Sell products</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password *</label>
                    <input type="password" id="password" class="form-input" minlength="6" required>
                    <small style="color: var(--text-secondary);">Must be at least 6 characters</small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm Password *</label>
                    <input type="password" id="confirm-password" class="form-input" required>
                </div>

                <div id="error-message"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </form>

            <p class="text-center mt-3">
                Already have an account? <a href="/login" style="color: var(--primary-color);">Login here</a>
            </p>

            <p class="text-center mt-2">
                <a href="/" style="color: var(--text-secondary);">Back to Home</a>
            </p>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        // Redirect if already logged in
        if (isAuthenticated()) {
            window.location.href = '/catalog';
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const lastname = document.getElementById('lastname').value.trim();
            const email = document.getElementById('email').value.trim();
            const birthdate = document.getElementById('birthdate').value;
            const address = document.getElementById('address').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const errorDiv = document.getElementById('error-message');

            errorDiv.innerHTML = '';

            // Validation
            if (!name || !lastname || !email || !password) {
                errorDiv.innerHTML = '<div class="alert alert-error">All required fields must be filled</div>';
                return;
            }

            if (password.length < 6) {
                errorDiv.innerHTML = '<div class="alert alert-error">Password must be at least 6 characters</div>';
                return;
            }

            if (password !== confirmPassword) {
                errorDiv.innerHTML = '<div class="alert alert-error">Passwords do not match</div>';
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorDiv.innerHTML = '<div class="alert alert-error">Invalid email format</div>';
                return;
            }

            const response = await apiRequest('/auth/register', {
                method: 'POST',
                body: JSON.stringify({ name, lastname, email, birthdate, address, password, role }),
            });

            if (response.ok && response.data.success) {
                showNotification('Registration successful! Please login.', 'success');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                errorDiv.innerHTML = `<div class="alert alert-error">${response.data.message || 'Registration failed'}</div>`;
            }
        });
    </script>
</body>

</html>
