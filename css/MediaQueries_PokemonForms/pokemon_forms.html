<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Forms</title>
    <link rel="stylesheet" href="pokemon_forms.css">
</head>

<body>
    <header>
        <h1>Pokemon Evolution Forms</h1>
    </header>

    <main>
        <article class="salamence">
            <h2>Salamence</h2>
            <img src="https://www.serebii.net/swordshield/pokemon/371.png" alt="Image of Bagon." class="Small Form">
            <img src="https://www.serebii.net/swordshield/pokemon/372.png" alt="Image of Shelgon." class="Medium Form">
            <img src="https://www.serebii.net/swordshield/pokemon/373.png" alt="Image of Salamence." class="Large Form">
        </article>

        <article class="gengar">
            <h2>Gengar</h2>
            <img src="https://www.serebii.net/scarletviolet/pokemon/new/small/092.png" alt="Image of Ghastly."
                class="Small Form">
            <img src="https://www.serebii.net/scarletviolet/pokemon/new/small/093.png" alt="Image of Haunter."
                class="Medium Form">
            <img src="https://www.serebii.net/scarletviolet/pokemon/new/small/094.png" alt="Image of Gengar."
                class="Large Form">
        </article>

        <article class="golem">
            <h2>Golem</h2>
            <img src="https://www.serebii.net/scarletviolet/pokemon/new/small/074.png" alt="Image of Geodude."
                class="Small Form">
            <img src="https://www.serebii.net/scarletviolet/pokemon/new/small/075.png" alt="Image of Graveler."
                class="Medium Form">
            <img src="https://www.serebii.net/scarletviolet/pokemon/new/small/076.png" alt="Image of Golem."
                class="Large Form">
        </article>

        <article class="machamp">
            <h2>Machamp</h2>
            <img src="https://www.serebii.net/swordshield/pokemon/small/066.png" alt="Image of Machop."
                class="Small Form">
            <img src="https://www.serebii.net/swordshield/pokemon/small/067.png" alt="Image of Machoke."
                class="Medium Form">
            <img src="https://www.serebii.net/swordshield/pokemon/small/068.png" alt="Image of Machamp."
                class="Large Form">
        </article>

        <article class="blastoise">
            <h2>Blastoise</h2>
            <img src="https://www.serebii.net/scarletviolet/pokemon/new/small/007.png" alt="Image of Squirtle."
                class="Small Form">
            <img src="https://www.serebii.net/scarletviolet/pokemon/new/small/008.png" alt="Image of Wartortle."
                class="Medium Form">
            <img src="https://www.serebii.net/scarletviolet/pokemon/new/small/009.png" alt="Image of Blastoise."
                class="Large Form">
        </article>
    </main>

    <footer>
