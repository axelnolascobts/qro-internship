<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tumblr Layout</title>
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <header>
    <aside class="header--left">
      <h1>tumblr</h1>
      <nav>
        <ul>
          <li>
            <button class="explore-btn-nav">Explore</button>
          </li>
          <li>
            <button class="communities-btn-nav">Communities</button>
          </li>
          <li>
            <button class="palette-btn-nav">Change palette</button>
          </li>
          <li>
            <button class="signup-btn-nav">Sign Up</button>
          </li>
          <li>
            <button class="login-btn-nav">Log In</button>
          </li>
        </ul>
      </nav>
    </aside>
    <div class="search-container">
      <p>Browse communities</p>
      <button>Create a community</button>
      <input type="text" name="search" placeholder="Search communities...">
    </div>
  </header>
  <main>
    <section class="communities-container">
      <img src="./3_metagross.svg" alt="Metagross1">
      <img src="./3_metagross.svg" alt="Metagross2">
      <img src="./3_metagross.svg" alt="Metagross3">
      <img src="./3_metagross.svg" alt="Metagross4">
      <img src="./3_metagross.svg" alt="Metagross5">
      <img src="./3_metagross.svg" alt="Metagross6">
      <img src="./3_metagross.svg" alt="Metagross7">
      <img src="./3_metagross.svg" alt="Metagross8">
      <img src="./3_metagross.svg" alt="Metagross9">
      <img src="./3_metagross.svg" alt="Metagross10">
      <img src="./3_metagross.svg" alt="Metagross11">
      <img src="./3_metagross.svg" alt="Metagross12">
      <img src="./3_metagross.svg" alt="Metagross13">
      <img src="./3_metagross.svg" alt="Metagross14">
    </section>
  </main>
  <footer>

  </footer>
</body>

</html>
