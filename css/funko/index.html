<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mickey Funko</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="parent-container">
        <div class="head">
            <div class="ears left-ear"></div>
            <div class="ears right-ear"></div>

            <div class="face">
                <div class="eyes left-eye"></div>
                <div class="eyes right-eye"></div>

                <div class="lid left-lid1"></div>
                <div class="lid left-lid2"></div>
                <div class="lid right-lid1"></div>
                <div class="lid right-lid2"></div>

                <div class="widow"></div>
                <div class="nose"></div>
            </div>
        </div>

        <div class="char-body">
            <div class="chest">
                <div class="pants">
                    <div class="buttons left-button"></div>
                    <div class="buttons right-button"></div>
                </div>
            </div>

            <div class="legs left-leg">
                <div class="shoe left-shoe"></div>
            </div>
            <div class="legs right-leg">
                <div class="shoe right-shoe"></div>
            </div>

            <div class="forearms left-forearm">
                <div class="glove left-glove"></div>
            </div>
            <div class="forearms right-forearm">
                <div class="glove right-glove"></div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
