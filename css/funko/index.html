<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funko Animation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="funko-container">
    <!-- Head Start -->
    <div class="head">
      <!-- Face Start -->
      <div class="face">
        <!-- Eyes Start -->
        <div class="eyes">
          <div class="eye left-eye"></div>
          <div class="eye right-eye"></div>
        </div>
        <!-- Eyes End -->
        <!-- Eyebrows Start -->
        <div class="eyebrows">
          <div class="eyebrow left-eyebrow"></div>
          <div class="eyebrow right-eyebrow"></div>
        </div>
        <!-- Eyebrows End -->
      </div>
      <!-- Face End -->
    </div>
    <!-- Head End -->
    <!-- Body Start -->
    <div class="body">
      <div class="torso"></div>
      <div class="arms">
        <div class="left-arm"></div>
        <div class="right-arm"></div>
      </div>
      <div class="legs"></div>
      <div class="tail"></div>
    </div>
    <!-- Body End -->
  </div>
</body>

</html>
