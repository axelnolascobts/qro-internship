<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock and Alarm</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Digital Clock and Alarm</h1>
    </header>

    <main>
        <div id="clock" class="hidden"></div>
        <div id="buttons">
            <button id="startClock">Start Clock</button>
            <button id="stopClock">Stop Clock</button>
            <button id="startAlarm">Start Alarm</button>
            <button id="stopAlarm">Stop Alarm</button>
        </div>

        <audio id="alarmSound" src="./thailand-alarm.mp3" loop></audio>
    </main>

    <script src="script.js"></script>
</body>

</html>
