<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <header>
    <h1>To-Do List</h1>
  </header>
  <main>
    <div class="main-container">
      <div class="input-container">
        <input type="text" id="inputTask" name="inputTask" placeholder="Write a new task..." maxlength="100">
        <button id="btnAdd" class="btn-add">Add Task</button>
      </div>

      <div class="counter-container">
        <p id="taskCounter">Pending tasks <span id="pendingNum">0</span></p>
      </div>

      <div id="taskList" class="tasks-container"></div>
    </div>
  </main>
  <script src="script.js"></script>
</body>

</html>
