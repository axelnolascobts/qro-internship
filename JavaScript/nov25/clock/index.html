<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm Clock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div id="clock" class="hidden">00:00:00</div>
        <div id="button-container">
            <button id="startClockBtn">Start Clock</button>
            <button id="stopClockBtn" disabled>Stop Clock</button>
            <button id="startAlarmBtn">Start Alarm</button>
            <button id="stopAlarmBtn" disabled>Stop Alarm</button>
        </div>
    </main>
    <script src="script.js">s</script>
</body>

</html>
