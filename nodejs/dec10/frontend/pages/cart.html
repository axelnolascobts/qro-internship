<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - E-Commerce Store</title>
  <script>
    // Prevent flash of unstyled content - load theme immediately
    (function() {
      const theme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">E-Shop</a>
      <div class="hamburger" id="hamburger">☰</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/catalog">Catalog</a></li>
        <li><a href="/cart">Cart (<span id="cartCount">0</span>)</a></li>
        <li><a href="/chat">Support Chat</a></li>
        <li id="authLinks"></li>
        <li><button class="theme-toggle" id="themeToggle">🌙</button></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <h1 class="cart-heading">Shopping Cart</h1>
    
    <div id="emptyCart" class="empty-state hidden">
      <h2>Your cart is empty</h2>
      <p>Add some products to get started!</p>
      <a href="/catalog" class="btn btn-primary">Browse Products</a>
    </div>

    <div id="cartContent" class="cart-content-container hidden">
      <div class="cart-items" id="cartItems"></div>
      
      <div class="cart-summary">
        <h2>Order Summary</h2>
        <div class="order-summary-row">
          <span>Subtotal:</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div class="order-summary-row">
          <span>Shipping:</span>
          <span>Free</span>
        </div>
        <hr class="order-summary-divider">
        <div class="order-summary-row">
          <span class="order-total-label">Total:</span>
          <span class="cart-total" id="total">$0.00</span>
        </div>
        <button class="btn btn-primary checkout-btn" onclick="window.location.href='/checkout'">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
