<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - E-Commerce Store</title>
  <script>
    // Prevent flash of unstyled content - load theme immediately
    (function() {
      const theme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">E-Shop</a>
      <div class="hamburger" id="hamburger">☰</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/catalog">Catalog</a></li>
        <li><a href="/login">Login</a></li>
        <li><button class="theme-toggle" id="themeToggle">🌙</button></li>
      </ul>
    </div>
  </nav>

  <div class="form-container">
    <h1 class="auth-heading">Register</h1>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">First Name</label>
        <input type="text" id="name" required>
        <span class="error" id="nameError"></span>
      </div>
      <div class="form-group">
        <label for="lastname">Last Name</label>
        <input type="text" id="lastname" required>
        <span class="error" id="lastnameError"></span>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <span class="error" id="emailError"></span>
      </div>
      <div class="form-group">
        <label for="password">Password (min 6 characters)</label>
        <input type="password" id="password" required minlength="6">
        <span class="error" id="passwordError"></span>
      </div>
      <div class="form-group">
        <label for="birthdate">Birth Date</label>
        <input type="date" id="birthdate" required>
        <span class="error" id="birthdateError"></span>
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" rows="3" required></textarea>
        <span class="error" id="addressError"></span>
      </div>
      <div class="form-group">
        <label for="role">Account Type</label>
        <select id="role" required>
          <option value="customer">Customer</option>
          <option value="seller">Seller</option>
        </select>
      </div>
      <div class="form-group">
        <button type="submit" class="btn btn-primary btn-full-width">Register</button>
      </div>
      <div class="form-group auth-footer">
        <p>Already have an account? <a href="/login" class="auth-link">Login here</a></p>
      </div>
    </form>
    <div id="message" class="auth-message"></div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
