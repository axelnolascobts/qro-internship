<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - E-Commerce Store</title>
  <script>
    // Prevent flash of unstyled content - load theme immediately
    (function() {
      const theme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">E-Shop</a>
      <div class="hamburger" id="hamburger">☰</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/catalog">Catalog</a></li>
        <li><a href="/cart">Cart (<span id="cartCount">0</span>)</a></li>
        <li><a href="/chat">Support Chat</a></li>
        <li id="authLinks"></li>
        <li><button class="theme-toggle" id="themeToggle">🌙</button></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <h1 class="profile-heading">My Profile</h1>

    <div class="profile-grid">
      <div class="form-container profile-form-container">
        <h2>Account Information</h2>
        <div id="userInfo"></div>
      </div>

      <div>
        <h2 class="orders-section-title">My Orders</h2>
        <div id="loading" class="loading hidden">Loading orders...</div>
        <div id="ordersList"></div>
        <div id="emptyState" class="empty-state hidden">
          <h3>No orders yet</h3>
          <p>Start shopping to see your orders here!</p>
          <a href="/catalog" class="btn btn-primary">Browse Products</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
