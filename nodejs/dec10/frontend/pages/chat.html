<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Chat - E-Commerce Store</title>
  <script>
    // Prevent flash of unstyled content - load theme immediately
    (function() {
      const theme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">E-Shop</a>
      <div class="hamburger" id="hamburger">☰</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/catalog">Catalog</a></li>
        <li><a href="/cart">Cart (<span id="cartCount">0</span>)</a></li>
        <li><a href="/profile">My Profile</a></li>
        <li id="authLinks"></li>
        <li><button class="theme-toggle" id="themeToggle">🌙</button></li>
      </ul>
    </div>
  </nav>

  <div class="chat-container">
    <div class="chat-header">
      <div>
        <h2>Support Chat</h2>
        <div class="users-list" id="usersList">Connected users: 0</div>
      </div>
      <div>
        <select id="roomSelect" class="room-select">
          <option value="general">General Support</option>
          <option value="order">Order Support</option>
        </select>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="chat-welcome">
        Welcome to support chat! Type your message below.
      </div>
    </div>

    <div class="typing-indicator hidden" id="typingIndicator"></div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type your message..." disabled>
      <button class="btn btn-primary" id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
